<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hoki POS - Data Pelamar Kerja</title>
    <link rel="icon" href="Assets/2.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d32f2f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Hoki POS">
    <link rel="apple-touch-icon" href="Assets/2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=DM+Mono:wght@400;500&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260501">
    <style>
    .form-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        padding: 20px;
        margin-bottom: 12px;
        box-shadow: var(--sh-sm);
    }
    .form-card h3 { margin: 0 0 16px; font-size: 14px; font-weight: 700; color: var(--text); }
    .grid-form {
        display: grid;
        grid-template-columns: 1.5fr 2fr 0.7fr 1.2fr 1.5fr auto;
        gap: 10px;
        align-items: end;
    }
    .input-group { display: flex; flex-direction: column; }
    .input-group > * + * { margin-top: 4px; }
    .input-group label {
        font-size: 10px; font-weight: 700; color: var(--text-muted);
        text-transform: uppercase; letter-spacing: 0.8px;
    }
    .input-group input {
        margin: 0; padding: 9px 12px; border: 1.5px solid var(--border);
        border-radius: var(--r-md); font-size: 13px; font-family: 'Nunito', sans-serif;
        background: var(--surface); color: var(--text); outline: none; transition: border-color 0.2s;
    }
    .input-group input:focus { border-color: var(--red); }
    .input-group input[type="file"] { padding: 6px 8px; font-size: 12px; }

    .table-wrap {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
        overflow: hidden; box-shadow: var(--sh-sm); overflow-x: auto;
    }
    .table-wrap table { width: 100%; border-collapse: collapse; }
    .table-wrap thead th {
        background: var(--red); color: white; padding: 10px 14px; font-size: 11px;
        font-weight: 600; text-transform: uppercase; border: none; text-align: left;
    }
    .table-wrap tbody td {
        padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px;
        color: var(--text); border-top: none; border-left: none; border-right: none;
    }
    .table-wrap tbody tr:last-child td { border-bottom: none; }
    .table-wrap tbody tr:hover td { background: var(--red-soft); }
    .mono { font-family: 'DM Mono', monospace; font-weight: 700; }

    .btn-cv {
        background: var(--blue-soft); color: var(--blue); border: 1px solid #bcdcf9;
        padding: 5px 10px; border-radius: var(--r-sm); font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .btn-cv:hover { filter: brightness(0.95); }
    .btn-wa-mini {
        background: #e8fbe9; color: #1a7d1f; border: 1px solid #b9ecbb;
        padding: 5px 10px; border-radius: var(--r-sm); font-size: 12px; font-weight: 700;
        text-decoration: none; display: inline-block;
    }

    /* ── MODAL PREVIEW CV ── */
    #cvModalOverlay {
        display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55);
        z-index: 9999; align-items: center; justify-content: center; padding: 20px;
    }
    #cvModalOverlay.open { display: flex; }
    .cv-modal-box {
        background: var(--surface); border-radius: var(--r-lg); width: 100%; max-width: 720px;
        max-height: 90vh; display: flex; flex-direction: column; box-shadow: var(--sh-lg);
    }
    .cv-modal-head {
        display: flex; align-items: center; justify-content: space-between;
        padding: 14px 18px; border-bottom: 1px solid var(--border);
    }
    .cv-modal-head h3 { font-size: 14px; font-weight: 700; margin: 0; }
    .cv-modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); }
    .cv-modal-body { padding: 14px; flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; }
    .cv-modal-body iframe { width: 100%; height: 70vh; border: none; border-radius: var(--r-md); }
    .cv-modal-body img { max-width: 100%; max-height: 70vh; border-radius: var(--r-md); }

    @media (max-width: 844px) {
        .grid-form { grid-template-columns: 1fr 1fr; }
        .grid-form button { grid-column: span 2; }
    }
    </style>
  <script src="config.js?v=20260829"></script>
</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand" onclick="toggleSidebar()">
        <div class="sidebar-logo"><img src="Assets/3.png" alt="Hoki"></div>
        <div class="sidebar-brand-text">
            <div class="sidebar-brand-name">Hoki Dimsum <span class="app-ver">V4.1</span></div>
            <div class="sidebar-brand-sub">POS System <span class="app-ver-lower">v4.1</span></div>
        </div>
    </div>
    <button class="sidebar-toggle" onclick="toggleSidebar()">‹</button>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-user">
        <div class="user-card">
            <div class="user-avatar" id="userAvatarInitial">?</div>
            <div class="user-info">
                <div class="user-name" id="sidebarUserName">Loading...</div>
                <div class="user-role" id="sidebarUserRole">—</div>
            </div>
            <button class="btn-logout-icon" onclick="logout()" title="Logout">🚪</button>
        </div>
    </div>
</aside>

<div class="main-content" id="mainContent">
    <header class="top-header">
        <div class="header-left">
            <div class="header-page-title">📋 Data Pelamar Kerja</div>
        </div>
        <div class="header-right">
            <div class="clock-pill">
                <div id="realtimeClock">00:00:00</div>
                <div id="realtimeDate">...</div>
            </div>
        </div>
    </header>

    <div class="page-body">
        <div class="form-card">
            <h3>➕ Tambah Pelamar</h3>
            <div class="grid-form">
                <div class="input-group">
                    <label>Nama</label>
                    <input type="text" id="pNama" placeholder="Nama lengkap">
                </div>
                <div class="input-group">
                    <label>Alamat</label>
                    <input type="text" id="pAlamat" placeholder="Alamat domisili">
                </div>
                <div class="input-group">
                    <label>Umur</label>
                    <input type="number" id="pUmur" placeholder="25">
                </div>
                <div class="input-group">
                    <label>No WA</label>
                    <input type="text" id="pNoWa" placeholder="0812xxxxxxx">
                </div>
                <div class="input-group">
                    <label>Dokumen CV (PDF/JPG/PNG, maks 5MB)</label>
                    <input type="file" id="pCv" accept=".pdf,.jpg,.jpeg,.png">
                </div>
                <button class="btn-simpan" onclick="simpanPelamar()">💾 Simpan</button>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Nama</th>
                        <th>Alamat</th>
                        <th>Umur</th>
                        <th>No WA</th>
                        <th>CV</th>
                        <th>Tanggal Masuk</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabelPelamar">
                    <tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-light);">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ── MODAL PREVIEW CV ── -->
<div id="cvModalOverlay" onclick="if(event.target===this) tutupCvModal()">
    <div class="cv-modal-box">
        <div class="cv-modal-head">
            <h3 id="cvModalTitle">Preview CV</h3>
            <button class="cv-modal-close" onclick="tutupCvModal()">×</button>
        </div>
        <div class="cv-modal-body" id="cvModalBody"></div>
    </div>
</div>

<nav class="bottom-nav">
    <button class="bn-item" onclick="location.href='dashboard.html'"><span class="bn-icon">🛒</span><span class="bn-label">Kasir</span></button>
    <button class="bn-item" onclick="location.href='history.html'"><span class="bn-icon">📄</span><span class="bn-label">History</span></button>
    <button class="bn-item" onclick="location.href='stok.html'"><span class="bn-icon">📦</span><span class="bn-label">Stok</span></button>
    <button class="bn-item" onclick="location.href='laporan_staff.html'"><span class="bn-icon">🚀</span><span class="bn-label">Laporan</span></button>
    <button class="bn-item active" onclick="openSheet('moreSheet')"><span class="bn-icon">☰</span><span class="bn-label">Lainnya</span></button>
</nav>

<div class="sheet-overlay" id="moreSheet" onclick="closeSheetOutside(event,'moreSheet')">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
        <div class="sheet-handle"></div>
        <p style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;">Menu Lainnya</p>
        <div class="more-grid" id="moreGrid"></div>
    </div>
</div>

<script>
const currentUser = JSON.parse(localStorage.getItem('currentUser')) || {user:'Guest', role:'Staff'};
if (!currentUser.user) window.location.href = 'index.html';
if (!['Owner','VIP'].includes(currentUser.role)) window.location.href = 'dashboard.html';

let allPelamar = [];

function toggleSidebar() {
    const sb = document.getElementById('sidebar');
    const mc = document.getElementById('mainContent');
    sb.classList.toggle('collapsed');
    mc.classList.toggle('expanded');
    localStorage.setItem('sidebarState', sb.classList.contains('collapsed') ? 'small' : 'large');
}

function buildSidebar() {
    if (localStorage.getItem('sidebarState') === 'small') {
        document.getElementById('sidebar').classList.add('collapsed');
        document.getElementById('mainContent').classList.add('expanded');
    }
    const role = currentUser.role;
    const cur  = window.location.pathname.split('/').pop() || 'dashboard.html';
    const navItem = (icon, label, link) => {
        const active = cur === link ? 'active' : '';
        return `<button class="nav-item ${active}" onclick="location.href='${link}'">
            <span class="nav-icon">${icon}</span>
            <span class="nav-label">${label}</span>
        </button>`;
    };
    const navItemExternal = (icon, label, url) => {
        return `<button class="nav-item" onclick="window.open('${url}', '_blank')">
            <span class="nav-icon">${icon}</span>
            <span class="nav-label">${label}</span>
        </button>`;
    };
    const PAGES_FRONTLINE = ['dashboard.html','history.html','stok.html','restock.html','laporan_staff.html','performa.html','edukasi.html'];
    const PAGES_MGMT      = ['rekap.html','produk.html'];
    const PAGES_EXEC      = ['laporan.html','statistik.html','promo.html','bahan_baku.html','hpp_produk.html','belanja.html','warehouse.html','salary_staff.html','customer_hoki.html','pelamar_kerja.html'];
    const PAGES_VIP       = ['user.html','login_history.html','cek_lokasi.html'];
    const PAGES_INVESTOR  = ['investor_omset.html','investor_profit.html'];
    const inGroup = pages => pages.includes(cur);
    const getOpen = (id, pages) => {
        const s = localStorage.getItem('navGroup_' + id);
        return s !== null ? s === '1' : true;
    };
    const GROUP_ICONS = { frontline:'🛒', management:'📊', executive:'📋', vip:'👑', investor:'🤝' };
    const navGroup = (id, label, items, pages) => {
        const open      = getOpen(id, pages);
        const hasActive = inGroup(pages);
        const icon      = GROUP_ICONS[id] || '📁';
        return `<div class="nav-group-wrap">
            <button class="nav-group-label${hasActive ? ' has-active' : ''}" onclick="toggleNavGroup('${id}')">
                <span class="nav-group-icon">${icon}</span>
                <span class="nav-group-text">${label}</span>
                <span class="nav-group-ti">${open ? '−' : '+'}</span>
            </button>
            <div class="nav-group-items" id="navg-${id}"${open ? '' : ' style="display:none"'}>
                ${items}
            </div>
        </div>`;
    };

    let frontline = navItem('🛒','Kasir','dashboard.html')
        + navItem('📄','History Transaksi','history.html')
        + navItem('📦','Stok Harian','stok.html')
        + navItem('🚚','Restock Barang','restock.html')
        + navItem('🚀','Laporan Penjualan','laporan_staff.html')
        + navItem('🏆','Performa','performa.html');
    let edukasiItem = navItem('📚','Edukasi & SOP','edukasi.html');
    frontline += edukasiItem;
    let h = '';
    if (role !== 'Investor') {
        h += navGroup('frontline', 'Frontline', frontline, PAGES_FRONTLINE);
    }

    if (['Senior Staff','SPV','Owner','VIP'].includes(role)) {
        let mgmt = navItem('🗓️','Rekapan Penjualan','rekap.html')
            + navItem('🍱','Master Produk','produk.html');
        h += navGroup('management', 'Management', mgmt, PAGES_MGMT);
    }
    if (['Owner','VIP'].includes(role)) {
        let exec = navItem('📊','Keuangan Global','laporan.html')
            + navItem('📈','Statistik & Analitik','statistik.html')
            + navItem('🏷️','Promo','promo.html')
            + navItem('🧂','Bahan Baku','bahan_baku.html')
            + navItem('🗃️','HPP Produk','hpp_produk.html')
            + navItem('🏭','Warehouse','warehouse.html')
            + navItem('📝','Belanja','belanja.html')
            + navItem('💵','Salary Staff','salary_staff.html')
            + navItem('👨‍👩‍👦','Customer Hoki','customer_hoki.html')
            + navItem('📋','Data Pelamar Kerja','pelamar_kerja.html');
        if (['kurniarp','hanazaf'].includes((currentUser.user || '').toLowerCase())) {
            exec += navItemExternal('🏢','PT Marajo Barokah', `https://marajo.pos-hokidimsum.com/sso.php?u=${encodeURIComponent(currentUser.user)}&t=${encodeURIComponent(localStorage.getItem('sessionToken') || '')}`);
        }
        h += navGroup('executive', 'Executive', exec, PAGES_EXEC);
    }
    if (['Owner','VIP','Investor'].includes(role)) {
        let inv = navItem('💹','Omset Cabang','investor_omset.html')
            + navItem('💰','Profit Sharing','investor_profit.html');
        h += navGroup('investor', 'Area Investor', inv, PAGES_INVESTOR);
    }
    if (role === 'VIP') {
        let vip = navItem('⚙️','Manajemen User','user.html')
            + navItem('🔑','History Login','login_history.html')
            + navItem('📍','Cek Lokasi','cek_lokasi.html')
            + navItemExternal('🍱','Menu Order','https://order.pos-hokidimsum.com/admin/dashboard.php');
        h += navGroup('vip', 'VIP Access', vip, PAGES_VIP);
    }
    document.getElementById('sidebarNav').innerHTML = h;
    const name = currentUser.user || '?';
    document.getElementById('userAvatarInitial').innerText = name.charAt(0).toUpperCase();
    document.getElementById('sidebarUserName').innerText   = name;
    document.getElementById('sidebarUserRole').innerText   = role;
}

function toggleNavGroup(id) {
    const items = document.getElementById('navg-' + id);
    const btn   = items.previousElementSibling;
    const ti    = btn.querySelector('.nav-group-ti');
    const open  = items.style.display !== 'none';
    items.style.display = open ? 'none' : '';
    if (ti) ti.textContent = open ? '+' : '−';
    localStorage.setItem('navGroup_' + id, open ? '0' : '1');
}

function updateClock() {
    const now = new Date();
    document.getElementById('realtimeClock').innerText = now.toLocaleTimeString('id-ID');
    document.getElementById('realtimeDate').innerText  = now.toLocaleDateString('id-ID',{weekday:'short',year:'numeric',month:'short',day:'numeric'});
}
setInterval(updateClock, 1000);

function buildMoreMenu() {
    const role = currentUser.role;
    const items = [{icon:'🚚',label:'Restock',link:'restock.html'}];
    items.push({icon:'📚',label:'Edukasi & SOP',link:'edukasi.html'});
    items.push({icon:'🏆',label:'Performa',link:'performa.html'});
    if (['Senior Staff','SPV','Owner','VIP'].includes(role)) {
        items.push({icon:'🍱',label:'Produk',link:'produk.html'});
        items.push({icon:'📈',label:'Rekapan',link:'rekap.html'});
    }
    if (['Owner','VIP'].includes(role)) {
        items.push({icon:'🏷️',label:'Promo',link:'promo.html'});
        items.push({icon:'🧂',label:'Bahan Baku',link:'bahan_baku.html'});
        items.push({icon:'🗃️',label:'HPP Produk',link:'hpp_produk.html'});
        items.push({icon:'🏭',label:'Warehouse',link:'warehouse.html'});
        items.push({icon:'📝',label:'Belanja',link:'belanja.html'});
        items.push({icon:'💵',label:'Salary Staff',link:'salary_staff.html'});
        items.push({icon:'📊',label:'Keuangan',link:'laporan.html'});
        items.push({icon:'📈',label:'Statistik & Analitik',link:'statistik.html'});
        items.push({icon:'👨‍👩‍👦',label:'Customer Hoki',link:'customer_hoki.html'});
        items.push({icon:'📋',label:'Data Pelamar Kerja',link:'pelamar_kerja.html'});
    }
    if (['Owner','VIP','Investor'].includes(role)) {
        items.push({icon:'💹',label:'Omset Cabang',link:'investor_omset.html'});
        items.push({icon:'💰',label:'Profit Sharing',link:'investor_profit.html'});
    }
    if (role === 'VIP') {
        items.push({icon:'⚙️',label:'Users',link:'user.html'});
        items.push({icon:'🔑',label:'Login Log',link:'login_history.html'});
        items.push({icon:'📍',label:'Cek Lokasi',link:'cek_lokasi.html'});
        items.push({icon:'🍱',label:'Menu Order',link:'#',action:"window.open('https://order.pos-hokidimsum.com/admin/dashboard.php','_blank')"});
    }
    items.push({icon:'🚪',label:'Logout',link:'#',action:'logout()'});
    document.getElementById('moreGrid').innerHTML = items.map(i =>
        `<button class="more-btn" onclick="${i.action||`location.href='${i.link}'`}">
            <span class="more-btn-icon">${i.icon}</span>
            <span class="more-btn-label">${i.label}</span>
        </button>`).join('');
}

function openSheet(id) { if(id==='moreSheet') buildMoreMenu(); document.getElementById(id).classList.add('open'); }
function closeSheetOutside(e,id) { if(e.target===document.getElementById(id)) document.getElementById(id).classList.remove('open'); }

function waLinkPelamar(no) {
    let n = (no || '').replace(/[^0-9]/g, '');
    if (n.startsWith('0')) n = '62' + n.slice(1);
    return `https://wa.me/${n}`;
}

async function muatPelamar() {
    try {
        const res   = await fetch('api-pelamar-kerja.php?action=list');
        const hasil = await res.json();
        allPelamar  = hasil.data || [];
        renderTabel();
    } catch(e) { console.error(e); }
}

function renderTabel() {
    const tbody = document.getElementById('tabelPelamar');
    if (!allPelamar.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-light);">Belum ada data pelamar</td></tr>';
        return;
    }
    tbody.innerHTML = allPelamar.map(p => {
        const tgl = p.created_at ? new Date(p.created_at.replace(' ', 'T')).toLocaleDateString('id-ID', {day:'2-digit',month:'short',year:'numeric'}) : '-';
        const cvBtn = p.cv_file
            ? `<button class="btn-cv" onclick="lihatCv('${p.cv_file}','${(p.nama || '').replace(/'/g, "\\'")}')">👁️ Preview</button>`
            : `<span style="color:var(--text-light);">-</span>`;
        const waBtn = p.no_wa
            ? `<a class="btn-wa-mini" href="${waLinkPelamar(p.no_wa)}" target="_blank">💬 WA</a>`
            : '';
        return `<tr>
            <td><b>${p.nama}</b></td>
            <td>${p.alamat || '-'}</td>
            <td class="mono">${p.umur || '-'}</td>
            <td>${p.no_wa || '-'} ${waBtn}</td>
            <td>${cvBtn}</td>
            <td>${tgl}</td>
            <td><button class="btn-hapus-icon" onclick="hapusPelamar(${p.id})" title="Hapus Data">🗑️</button></td>
        </tr>`;
    }).join('');
}

function lihatCv(filename, nama) {
    const url = `uploads/pelamar_cv/${filename}`;
    const ext = filename.split('.').pop().toLowerCase();
    document.getElementById('cvModalTitle').innerText = `📄 CV - ${nama}`;
    const body = document.getElementById('cvModalBody');
    if (ext === 'pdf') {
        body.innerHTML = `<iframe src="${url}"></iframe>`;
    } else {
        body.innerHTML = `<img src="${url}" alt="CV ${nama}">`;
    }
    document.getElementById('cvModalOverlay').classList.add('open');
}
function tutupCvModal() {
    document.getElementById('cvModalOverlay').classList.remove('open');
    document.getElementById('cvModalBody').innerHTML = '';
}

async function simpanPelamar() {
    const nama   = document.getElementById('pNama').value.trim();
    const alamat = document.getElementById('pAlamat').value.trim();
    const umur   = document.getElementById('pUmur').value.trim();
    const noWa   = document.getElementById('pNoWa').value.trim();
    const cvFile = document.getElementById('pCv').files[0];

    if (!nama) return toast.warning('Nama wajib diisi!');

    const fd = new FormData();
    fd.append('user', currentUser.user);
    fd.append('token', localStorage.getItem('sessionToken') || '');
    fd.append('nama', nama);
    fd.append('alamat', alamat);
    fd.append('umur', umur);
    fd.append('no_wa', noWa);
    if (cvFile) fd.append('cv', cvFile);

    try {
        const res   = await fetch('api-pelamar-kerja.php?action=save', { method: 'POST', body: fd });
        const hasil = await res.json();
        if (hasil.status === 'success') {
            toast.success('Data pelamar berhasil disimpan!');
            ['pNama','pAlamat','pUmur','pNoWa'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('pCv').value = '';
            muatPelamar();
        } else {
            toast.error(hasil.message || 'Gagal menyimpan!');
        }
    } catch(e) { toast.error('Gagal koneksi server!'); }
}

async function hapusPelamar(id) {
    const ok = await showConfirm('Hapus data pelamar ini beserta CV-nya?', 'Ya, Hapus', 'Batal', '🗑️');
    if (!ok) return;
    const fd = new FormData();
    fd.append('user', currentUser.user);
    fd.append('token', localStorage.getItem('sessionToken') || '');
    fd.append('id', id);
    try {
        const res   = await fetch('api-pelamar-kerja.php?action=delete', { method: 'POST', body: fd });
        const hasil = await res.json();
        if (hasil.status === 'success') {
            toast.success('Data pelamar dihapus!');
            muatPelamar();
        } else {
            toast.error(hasil.message || 'Gagal menghapus!');
        }
    } catch(e) { toast.error('Gagal koneksi server!'); }
}

async function logout() {
    const ok = await showConfirm('Logout dari sistem?', 'Ya, Logout', 'Batal', '🚪');
    if (ok) {
        localStorage.removeItem('currentUser');
        localStorage.removeItem('cabangHoki');
        window.location.href = 'index.html';
    }
}

window.onload = () => { buildSidebar(); updateClock(); muatPelamar(); };
</script>

<script src="session.js"></script>
<script src="toast.js"></script>
</body>
