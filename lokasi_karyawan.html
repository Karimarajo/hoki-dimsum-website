<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hoki POS - Lokasi Karyawan</title>
        <link rel="icon" href="Assets/2.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d32f2f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Hoki POS">
    <link rel="apple-touch-icon" href="Assets/2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=DM+Mono:wght@400;500&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260501">
    <!-- Leaflet CSS (CDN, tanpa API key) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>

    /* ── MAP ── */
    #mapContainer {
        width: 100%;
        height: calc(100dvh - 170px);
        min-height: 400px;
        border-radius: var(--r-lg);
        border: 1px solid var(--border);
        box-shadow: var(--sh-sm);
        overflow: hidden;
    }

    /* ── FILTER BAR ── */
    .filter-row {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        padding: 14px 18px;
        margin-bottom: 12px;
        box-shadow: var(--sh-sm);
    }
    .filter-row > * + * { margin-left: 12px; }

    .filter-row label {
        font-size: 10px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.8px;
        margin-bottom: 4px;
    }

    .stat-strip {
        display: flex;
        flex-wrap: wrap;
        margin-bottom: 12px;
    }
    .stat-strip > * + * { margin-left: 10px; }

    .stat-chip {
        display: inline-flex;
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 99px;
        padding: 6px 14px;
        font-size: 12px;
        font-weight: 700;
        color: var(--text);
    }
    .stat-chip > * + * { margin-left: 6px; }
    .stat-chip .num {
        font-family: 'DM Mono', monospace;
        color: var(--red);
    }

    /* ── POPUP ── */
    .leaflet-popup-content {
        font-family: 'Nunito', sans-serif;
        font-size: 12px;
        line-height: 1.5;
        min-width: 180px;
    }
    .popup-name {
        font-size: 14px;
        font-weight: 800;
        color: var(--text);
        margin-bottom: 2px;
    }
    .popup-meta {
        color: var(--text-muted);
        font-size: 11px;
    }
    .popup-time {
        font-family: 'DM Mono', monospace;
        font-size: 11px;
        color: var(--red);
        margin-top: 4px;
    }

    /* ── MOBILE ── */
    @media (max-width: 844px) {
        .header-page-title { font-size: 13px !important; }
        #mapContainer { height: calc(100dvh - 240px); min-height: 300px; }
        .filter-row { flex-direction: column; align-items: stretch; }
        .filter-row > * + * { margin-left: 0; margin-top: 8px; }
    }

    </style>
  <script src="config.js?v=20260927"></script>
</head>
<body>

<!-- ── SIDEBAR ── -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand" onclick="toggleSidebar()">
        <div class="sidebar-logo">
            <img src="Assets/3.png" alt="Hoki">
        </div>
        <div class="sidebar-brand-text">
            <div class="sidebar-brand-name">Hoki Dimsum <span class="app-ver">V4.1</span></div>
            <div class="sidebar-brand-sub">POS System <span class="app-ver-lower">v4.1</span></div>
        </div>
    </div>
    <button class="sidebar-toggle" onclick="toggleSidebar()">‹</button>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-user">
        <div class="user-card">
            <div class="user-avatar" id="userAvatarInitial">?</div>
            <div class="user-info">
                <div class="user-name" id="sidebarUserName">Loading...</div>
                <div class="user-role" id="sidebarUserRole">—</div>
            </div>
            <button class="btn-logout-icon" onclick="logout()" title="Logout">🚪</button>
        </div>
    </div>
</aside>

<!-- ── MAIN CONTENT ── -->
<div class="main-content" id="mainContent">

    <header class="top-header">
        <div class="header-left">
            <div class="header-page-title">📍 Lokasi Karyawan</div>
        </div>
        <div class="header-right">
            <div class="clock-pill">
                <div id="realtimeClock">00:00:00</div>
                <div id="realtimeDate">...</div>
            </div>
        </div>
    </header>

    <div class="page-body">
        <!-- Filter -->
        <div class="filter-row">
            <div>
                <label for="filterTanggal">Tanggal</label>
                <input type="date" id="filterTanggal" style="width:170px;">
            </div>
            <button class="btn-cari" onclick="loadData()" style="background:#2563EB;color:#fff;padding:10px 18px;">🔍 Cari</button>
            <button class="btn-hari-ini" onclick="resetHariIni()" style="padding:10px 18px;">Hari Ini</button>
        </div>

        <!-- Stats -->
        <div class="stat-strip" id="statStrip">
            <div class="stat-chip"><span>👥</span><span>Karyawan:</span><span class="num" id="statTotal">0</span></div>
            <div class="stat-chip"><span>🟢</span><span>Online (1 jam):</span><span class="num" id="statOnline">0</span></div>
        </div>

        <!-- Map -->
        <div id="mapContainer"></div>
    </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
    <button class="bn-item" onclick="location.href='dashboard.html'"><span class="bn-icon">🛒</span><span class="bn-label">Kasir</span></button>
    <button class="bn-item" onclick="location.href='history.html'"><span class="bn-icon">📄</span><span class="bn-label">History</span></button>
    <button class="bn-item" onclick="location.href='stok.html'"><span class="bn-icon">📦</span><span class="bn-label">Stok</span></button>
    <button class="bn-item" onclick="location.href='laporan_staff.html'"><span class="bn-icon">🚀</span><span class="bn-label">Laporan</span></button>
    <button class="bn-item active" onclick="openSheet('moreSheet')"><span class="bn-icon">☰</span><span class="bn-label">Lainnya</span></button>
</nav>

<!-- MORE SHEET -->
<div class="sheet-overlay" id="moreSheet" onclick="closeSheetOutside(event,'moreSheet')">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
        <div class="sheet-handle"></div>
        <p style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;">Menu Lainnya</p>
        <div class="more-grid" id="moreGrid"></div>
    </div>
</div>

<!-- Leaflet JS (CDN, tanpa API key) -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="session.js"></script>
<script src="toast.js"></script>
<script src="error-log.js"></script>

<script>
const currentUser = JSON.parse(localStorage.getItem('currentUser'));
if (!currentUser) window.location.href = 'index.html';

// ── GUARD: halaman ini HANYA untuk VIP ──
if (currentUser.role !== 'VIP') {
    window.location.href = 'dashboard.html';
}

/* ── SIDEBAR ── */
function toggleSidebar() {
    const sb = document.getElementById('sidebar');
    const mc = document.getElementById('mainContent');
    sb.classList.toggle('collapsed');
    mc.classList.toggle('expanded');
    localStorage.setItem('sidebarState', sb.classList.contains('collapsed') ? 'small' : 'large');
}

function buildSidebar() {
    if (localStorage.getItem('sidebarState') === 'small') {
        document.getElementById('sidebar').classList.add('collapsed');
        document.getElementById('mainContent').classList.add('expanded');
    }
    const role = currentUser.role;
    const cur  = window.location.pathname.split('/').pop() || 'dashboard.html';
    const navItem = (icon, label, link) => {
        const active = cur === link ? 'active' : '';
        return `<button class="nav-item ${active}" onclick="location.href='${link}'">
            <span class="nav-icon">${icon}</span>
            <span class="nav-label">${label}</span>
        </button>`;
    };
    const navItemExternal = (icon, label, url) => {
        return `<button class="nav-item" onclick="window.open('${url}', '_blank')">
            <span class="nav-icon">${icon}</span>
            <span class="nav-label">${label}</span>
        </button>`;
    };
    const PAGES_FRONTLINE = ['dashboard.html','history.html','stok.html','restock.html','laporan_staff.html','performa.html','edukasi.html'];
    const PAGES_MGMT      = ['rekap.html','produk.html'];
    const PAGES_EXEC      = ['laporan.html','statistik.html','promo.html','bahan_baku.html','hpp_produk.html','belanja.html','warehouse.html','salary_staff.html','customer_hoki.html','pelamar_kerja.html'];
    const PAGES_VIP       = ['user.html','login_history.html','manajemen_penilaian.html','lokasi_karyawan.html','unlock_uninstall.html'];
    const PAGES_INVESTOR  = ['investor_omset.html','investor_profit.html'];
    const inGroup = pages => pages.includes(cur);
    const getOpen = (id, pages) => {
        const s = localStorage.getItem('navGroup_' + id);
        return s !== null ? s === '1' : true;
    };
    const GROUP_ICONS = { frontline:'🛒', management:'📊', executive:'📋', vip:'👑', investor:'🤝' };
    const navGroup = (id, label, items, pages) => {
        const open      = getOpen(id, pages);
        const hasActive = inGroup(pages);
        const icon      = GROUP_ICONS[id] || '📁';
        return `<div class="nav-group-wrap">
            <button class="nav-group-label${hasActive ? ' has-active' : ''}" onclick="toggleNavGroup('${id}')">
                <span class="nav-group-icon">${icon}</span>
                <span class="nav-group-text">${label}</span>
                <span class="nav-group-ti">${open ? '−' : '+'}</span>
            </button>
            <div class="nav-group-items" id="navg-${id}"${open ? '' : ' style="display:none"'}>
                ${items}
            </div>
        </div>`;
    };

    let frontline = navItem('🛒','Kasir','dashboard.html')
        + navItem('📄','History Transaksi','history.html')
        + navItem('📦','Stok Harian','stok.html')
        + navItem('🚚','Restock Barang','restock.html')
        + navItem('🚀','Laporan Penjualan','laporan_staff.html')
        + navItem('🏆','Performa','performa.html');
    let edukasiItem = navItem('📚','Edukasi & SOP','edukasi.html');
    frontline += edukasiItem;
    let h = '';
    if (role !== 'Investor') {
        h += navGroup('frontline', 'Frontline', frontline, PAGES_FRONTLINE);
    }

    if (['Senior Staff','SPV','Owner','VIP'].includes(role)) {
        let mgmt = navItem('🗓️','Rekapan Penjualan','rekap.html')
            + navItem('🍱','Master Produk','produk.html');
        h += navGroup('management', 'Management', mgmt, PAGES_MGMT);
    }
    if (['Owner','VIP'].includes(role)) {
        let exec = navItem('📊','Keuangan Global','laporan.html')
            + navItem('📈','Statistik & Analitik','statistik.html')
            + navItem('🏷️','Promo','promo.html')
            + navItem('🧂','Bahan Baku','bahan_baku.html')
            + navItem('🗃️','HPP Produk','hpp_produk.html')
            + navItem('🏭','Warehouse','warehouse.html')
            + navItem('📝','Belanja','belanja.html')
            + navItem('💵','Salary Staff','salary_staff.html')
            + navItem('👨‍👩‍👦','Customer Hoki','customer_hoki.html')
            + navItem('📋','Data Pelamar Kerja','pelamar_kerja.html');
        if (['kurniarp','hanazaf'].includes((currentUser.user || '').toLowerCase())) {
            exec += navItemExternal('🏢','PT Marajo Barokah', `https://marajo.pos-hokidimsum.com/sso.php?u=${encodeURIComponent(currentUser.user)}&t=${encodeURIComponent(localStorage.getItem('sessionToken') || '')}`);
        }
        h += navGroup('executive', 'Executive', exec, PAGES_EXEC);
    }
    if (['Owner','VIP','Investor'].includes(role)) {
        let inv = navItem('💹','Omset Cabang','investor_omset.html')
            + navItem('💰','Profit Sharing','investor_profit.html');
        h += navGroup('investor', 'Area Investor', inv, PAGES_INVESTOR);
    }
    if (role === 'VIP') {
        let vip = navItem('⚙️','Manajemen User','user.html')
            + navItem('🔑','History Login','login_history.html')
            + navItem('📝','Manajemen Penilaian','manajemen_penilaian.html')
            + navItem('📍','Lokasi Karyawan','lokasi_karyawan.html')
            + navItem('🔓','Unlock Uninstall','unlock_uninstall.html')
            + navItemExternal('🍱','Menu Order','https://order.pos-hokidimsum.com/admin/dashboard.php');
        h += navGroup('vip', 'VIP Access', vip, PAGES_VIP);
    }
    document.getElementById('sidebarNav').innerHTML = h;
    const name = currentUser.user || '?';
    document.getElementById('userAvatarInitial').innerText = name.charAt(0).toUpperCase();
    document.getElementById('sidebarUserName').innerText   = name;
    document.getElementById('sidebarUserRole').innerText   = role;
}

function toggleNavGroup(id) {
    const items = document.getElementById('navg-' + id);
    const btn   = items.previousElementSibling;
    const ti    = btn.querySelector('.nav-group-ti');
    const open  = items.style.display !== 'none';
    items.style.display = open ? 'none' : '';
    if (ti) ti.textContent = open ? '+' : '−';
    localStorage.setItem('navGroup_' + id, open ? '0' : '1');
}

/* ── CLOCK ── */
function updateClock() {
    const now = new Date();
    document.getElementById('realtimeClock').innerText = now.toLocaleTimeString('id-ID');
    document.getElementById('realtimeDate').innerText  = now.toLocaleDateString('id-ID',{weekday:'short',year:'numeric',month:'short',day:'numeric'});
}
setInterval(updateClock, 1000);

/* ── MORE MENU (bottom sheet mobile) ── */
function buildMoreMenu() {
    const role = currentUser.role;
    const items = [{icon:'🚚',label:'Restock',link:'restock.html'}];
    items.push({icon:'📚',label:'Edukasi & SOP',link:'edukasi.html'});
    items.push({icon:'🏆',label:'Performa',link:'performa.html'});
    if (['Senior Staff','SPV','Owner','VIP'].includes(role)) {
        items.push({icon:'📈',label:'Rekapan',link:'rekap.html'});
    }
    if (['Owner','VIP'].includes(role)) {
        items.push({icon:'🍱',label:'Produk',link:'produk.html'});
        items.push({icon:'🏷️',label:'Promo',link:'promo.html'});
        items.push({icon:'🧂',label:'Bahan Baku',link:'bahan_baku.html'});
        items.push({icon:'🗃️',label:'HPP Produk',link:'hpp_produk.html'});
        items.push({icon:'🏭',label:'Warehouse',link:'warehouse.html'});
        items.push({icon:'📝',label:'Belanja',link:'belanja.html'});
        items.push({icon:'💵',label:'Salary Staff',link:'salary_staff.html'});
        items.push({icon:'📊',label:'Keuangan',link:'laporan.html'});
        items.push({icon:'📈',label:'Statistik & Analitik',link:'statistik.html'});
        items.push({icon:'👨‍👩‍👦',label:'Customer Hoki',link:'customer_hoki.html'});
        items.push({icon:'📋',label:'Data Pelamar Kerja',link:'pelamar_kerja.html'});
    }
    if (['Owner','VIP','Investor'].includes(role)) {
        items.push({icon:'💹',label:'Omset Cabang',link:'investor_omset.html'});
        items.push({icon:'💰',label:'Profit Sharing',link:'investor_profit.html'});
    }
    if (role === 'VIP') {
        items.push({icon:'⚙️',label:'Users',link:'user.html'});
        items.push({icon:'🔑',label:'Login Log',link:'login_history.html'});
        items.push({icon:'📝',label:'Manajemen Penilaian',link:'manajemen_penilaian.html'});
        items.push({icon:'📍',label:'Lokasi Karyawan',link:'lokasi_karyawan.html'});
        items.push({icon:'🔓',label:'Unlock Uninstall',link:'unlock_uninstall.html'});
        items.push({icon:'🍱',label:'Menu Order',link:'#',action:"window.open('https://order.pos-hokidimsum.com/admin/dashboard.php','_blank')"});
    }
    if (['kurniarp','hanazaf'].includes((currentUser.user || '').toLowerCase())) {
        items.push({icon:'🏢',label:'PT Marajo Barokah',link:'#',action:'bukaMarajo()'});
    }
    items.push({icon:'🚪',label:'Logout',link:'#',action:'logout()'});
    document.getElementById('moreGrid').innerHTML = items.map(i =>
        `<button class="more-btn" onclick="${i.action||`location.href='${i.link}'`}">
            <span class="more-btn-icon">${i.icon}</span>
            <span class="more-btn-label">${i.label}</span>
        </button>`).join('');
}

function openSheet(id) { if(id==='moreSheet') buildMoreMenu(); document.getElementById(id).classList.add('open'); }
function closeSheetOutside(e, id) { if (e.target === document.getElementById(id)) document.getElementById(id).classList.remove('open'); }
async function logout() {
    const ok = await showConfirm('Logout dari sistem?', 'Ya, Logout', 'Batal', '🚪');
    if (ok) {
        localStorage.removeItem('currentUser');
        localStorage.removeItem('cabangHoki');
        window.location.href = 'index.html';
    }
}

/* ═══════════════════════════════════════════════════
   MAP & DATA
   ═══════════════════════════════════════════════════ */

// Inisialisasi peta — center di Indonesia
const map = L.map('mapContainer').setView([-6.2, 106.85], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
}).addTo(map);

// Custom icon merah (tema Hoki Dimsum)
const markerIcon = L.divIcon({
    className: '',
    html: `<div style="
        width:32px;height:32px;border-radius:50% 50% 50% 0;
        background:#d32f2f;border:3px solid #fff;
        box-shadow:0 2px 8px rgba(0,0,0,0.3);
        transform:rotate(-45deg);
        display:flex;align-items:center;justify-content:center;
    "><span style="transform:rotate(45deg);font-size:14px;">📍</span></div>`,
    iconSize: [32, 32],
    iconAnchor: [16, 32],
    popupAnchor: [0, -32]
});

let markers = [];

function clearMarkers() {
    markers.forEach(m => map.removeLayer(m));
    markers = [];
}

function resetHariIni() {
    document.getElementById('filterTanggal').value = '';
    loadData();
}

async function loadData() {
    const token  = localStorage.getItem('sessionToken') || '';
    const user   = currentUser.user || '';
    const tanggal = document.getElementById('filterTanggal').value || '';

    let url = `${API_BASE}?action=get_location_log&user=${encodeURIComponent(user)}&token=${encodeURIComponent(token)}`;
    if (tanggal) url += `&tanggal=${tanggal}`;

    try {
        const res  = await fetch(url);
        const json = await res.json();

        if (json.status !== 'success') {
            toast.error('Gagal memuat data', json.message || '');
            return;
        }

        const data = json.data || [];
        clearMarkers();

        // Hitung statistik
        const uniqueUsers = [...new Set(data.map(d => d.user_login))];
        const now = Date.now();
        const oneHourAgo = now - (60 * 60 * 1000);
        const onlineCount = data.filter(d => {
            const t = new Date(d.waktu).getTime();
            return t >= oneHourAgo;
        }).length;

        document.getElementById('statTotal').innerText  = uniqueUsers.length;
        document.getElementById('statOnline').innerText = onlineCount;

        if (data.length === 0) {
            toast.info('Tidak ada data lokasi' + (tanggal ? ' untuk tanggal ini' : ''));
            return;
        }

        // Tambahkan marker ke peta
        const bounds = [];
        data.forEach(d => {
            const lat = parseFloat(d.lat);
            const lng = parseFloat(d.lng);
            if (isNaN(lat) || isNaN(lng)) return;

            const akurasi = d.akurasi_meter ? `± ${parseFloat(d.akurasi_meter).toFixed(0)}m` : '';
            const cabang  = d.cabang || '-';
            const waktu   = d.waktu || '-';

            const popup = `
                <div class="popup-name">${d.user_login}</div>
                <div class="popup-meta">📌 Cabang: ${cabang}</div>
                ${akurasi ? `<div class="popup-meta">🎯 Akurasi: ${akurasi}</div>` : ''}
                <div class="popup-time">🕐 ${waktu}</div>
            `;

            const marker = L.marker([lat, lng], { icon: markerIcon })
                .addTo(map)
                .bindPopup(popup);
            markers.push(marker);
            bounds.push([lat, lng]);
        });

        // Zoom peta ke semua marker
        if (bounds.length > 0) {
            if (bounds.length === 1) {
                map.setView(bounds[0], 15);
            } else {
                map.fitBounds(bounds, { padding: [40, 40] });
            }
        }

    } catch (err) {
        toast.error('Gagal koneksi server', err.message || '');
    }
}

/* ── INIT ── */
window.onload = () => {
    buildSidebar();
    updateClock();
    loadData();

    // Invalidate map size after layout settles (sidebar animation)
    setTimeout(() => map.invalidateSize(), 500);
};

// Re-invalidate when sidebar toggles (map container width changes)
const origToggle = toggleSidebar;
window.toggleSidebar = function() {
    origToggle();
    setTimeout(() => map.invalidateSize(), 350);
};
</script>
</body>
</html>
